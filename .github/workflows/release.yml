name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write  # Required for trusted publishing

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has-release: ${{ steps.check.outputs.has-release }}
    steps:
      - uses: actions/checkout@v4

      - uses: autopub/autopub-action@v1.1.1
        id: check
        with:
          command: check
          autopub-version: "1.0.0a63"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: check
    if: needs.check.outputs.has-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: autopub/autopub-action@v1.1.1
        with:
          command: prepare
          autopub-version: "1.0.0a63"

      - uses: autopub/autopub-action@v1.1.1
        with:
          command: build
          autopub-version: "1.0.0a63"

      - uses: autopub/autopub-action@v1.1.1
        with:
          command: publish
          autopub-version: "1.0.0a63"

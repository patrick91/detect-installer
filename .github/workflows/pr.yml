name: PR Check

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      # allow-unsafe-pr-checkout is required so AutoPub can check fork PRs; the
      # sparse checkout below limits the PR working tree to metadata parsed as data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "refs/pull/${{ github.event.number }}/merge"
          allow-unsafe-pr-checkout: true
          persist-credentials: false
          sparse-checkout: |
            RELEASE.md
            pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: autopub/autopub-action@v1.1.1
        with:
          command: check
          autopub-version: "1.0.0a63"
          github-token: ${{ secrets.GITHUB_TOKEN }}
